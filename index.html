<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <title>Yasmin Ótica - Sistema de Gestão e Analytics</title>
    <meta name="description" content="Sistema de Gestão Integrado Yasmin Ótica - Vendas, Ordens de Serviço, Clientes, Estoque e ERP." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body style="background-color: #F2EFE7; margin: 0; padding: 0; font-family: 'Outfit', 'Inter', sans-serif;">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F2EFE7; background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 12%, 0.95) 0, transparent 65%), radial-gradient(at 100% 100%, hsla(260, 100%, 12%, 0.95) 0, transparent 65%); color: white; user-select: none; z-index: 99999;">
        <div style="position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 320px; height: 320px; background: radial-gradient(circle, rgba(236,72,153,0.25) 0%, rgba(7,11,20,0) 70%); border-radius: 50%; filter: blur(50px);"></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 360px; padding: 20px;">
          <div style="background: rgba(15, 23, 42, 0.9); padding: 16px 24px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 35px rgba(236, 72, 153, 0.25); margin-bottom: 20px;">
            <img src="/logo-yasmin-transparent.png" alt="Yasmin Ótica" style="height: 64px; width: auto; object-contain;" onerror="this.src='/logo-yasmin.png';" />
          </div>
          <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; margin: 0 0 6px 0; color: #ffffff;">YASMIN ÓTICA</h1>
          <p style="font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; margin: 0 0 24px 0; background: rgba(255,255,255,0.05); padding: 4px 14px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.05);">Sistema de Gestão & ERP</p>
          
          <div style="width: 220px; height: 6px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 16px;">
            <div style="position: absolute; top: 0; left: 0; height: 100%; width: 45%; background: linear-gradient(90deg, #ec4899, #10b981); border-radius: 9999px; animation: splashPulse 1.2s infinite ease-in-out;"></div>
          </div>
          <p id="splash-status-text" style="font-size: 12px; font-weight: 600; color: #cbd5e1; margin: 0;">Inicializando sistema...</p>
          <div id="splash-timeout-box" style="display: none; margin-top: 18px;">
            <p style="font-size: 11px; color: #f87171; margin: 0 0 10px 0; font-weight: 500;">
              O carregamento está demorando mais que o esperado.
            </p>
            <button onclick="clearAndHardReload();" style="padding: 7px 16px; font-size: 11px; font-weight: bold; background: linear-gradient(135deg, #ec4899, #db2777); border: none; color: #ffffff; border-radius: 9999px; cursor: pointer; box-shadow: 0 4px 12px rgba(236,72,153,0.3);">
              Recarregar Sistema (Limpar Cache)
            </button>
          </div>
        </div>
      </div>
      <style>
        @keyframes splashPulse {
          0% { left: -45%; width: 45%; }
          50% { left: 35%; width: 60%; }
          100% { left: 100%; width: 45%; }
        }
      </style>
    </div>
    <script>
      function clearAndHardReload() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
        } catch(e) {}
        try { localStorage.clear(); sessionStorage.clear(); } catch(e) {}
        window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
      }

      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        var isRawSourceCode = !!document.querySelector('script[src*="/src/main.jsx"]');
        var isProductionDomain = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

        // Alerta SOMENTE se arquivos brutos não-compilados (.jsx) estiverem sendo servidos em produção
        if (isRawSourceCode && isProductionDomain && (msg.includes('module') || msg.includes('syntaxerror') || msg.includes('unexpected token') || msg.includes('failed to resolve'))) {
          var box = document.getElementById('splash-timeout-box');
          if (box) {
            box.style.display = 'block';
            box.innerHTML = '<div style="background: rgba(239,68,68,0.25); border: 1px solid rgba(239,68,68,0.6); border-radius: 16px; padding: 14px; margin-top: 14px; color: #fca5a5; font-size: 11px; text-align: center;"><p style="font-weight: 800; font-size: 13px; margin: 0 0 6px 0; color: #fee2e2;">⚠️ ATENÇÃO: ARQUIVOS DE DESENVOLVIMENTO DETECTADOS</p><p style="margin: 0 0 8px 0; line-height: 1.4;">Você extraiu o ZIP de código-fonte ao invés do ZIP do site compilado.<br>O navegador não executa arquivos .jsx brutos sem compilação.</p><p style="margin: 0; font-weight: bold; color: #ffffff; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px;">Por favor, extraia o arquivo <u>site-hostinger-public_html.zip</u> na pasta public_html.</p></div>';
          }
        } else if (msg.includes('module') || msg.includes('syntaxerror') || msg.includes('unexpected token') || msg.includes('failed to fetch') || msg.includes('load')) {
          var pBox = document.getElementById('splash-timeout-box');
          if (pBox) {
            pBox.style.display = 'block';
            pBox.innerHTML = '<div style="background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.5); border-radius: 16px; padding: 14px; margin-top: 14px; color: #fca5a5; font-size: 11px; text-align: center;"><p style="font-weight: 800; font-size: 13px; margin: 0 0 6px 0; color: #fee2e2;">⚠️ Inconsistência no Carregamento</p><p style="margin: 0 0 10px 0; line-height: 1.4; color: #fecaca;">Pode haver dados em cache desatualizados no navegador.</p><button onclick="clearAndHardReload();" style="padding: 8px 18px; font-size: 12px; font-weight: bold; background: linear-gradient(135deg, #ec4899, #db2777); border: none; color: #ffffff; border-radius: 9999px; cursor: pointer; box-shadow: 0 4px 12px rgba(236,72,153,0.3);">Limpar Cache e Recarregar Agora</button></div>';
          }
        }
      });

      setTimeout(function() {
        var box = document.getElementById('splash-timeout-box');
        if (box && document.getElementById('splash-status-text')) {
          box.style.display = 'block';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
